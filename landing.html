---
layout: none
permalink: /
---

<!DOCTYPE html>
<html lang="{{ site.lang | default: 'id-ID' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Saya</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .hero {
            background: url('https://source.unsplash.com/1600x900/?blog,nature') center/cover;
            color: white;
            padding: 80px 20px;
            text-align: center;
        }
        .post-card img {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Blog Saya</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/blog">Artikel</a></li>
                    <li class="nav-item"><a class="nav-link" href="/tentang">Tentang</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-outline-light" href="{{site.baseurl}}/admin/login">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="container">
            <h1>Selamat Datang di Blog Saya</h1>
            <p>Tempat berbagi cerita, pengalaman, dan wawasan menarik</p>
            <a href="/produk" class="btn btn-primary">Lihat Produk</a>
        </div>
    </header>

    <!-- Postingan Terbaru -->
    <section class="container mt-5">
        <h2 class="text-center">Postingan Terbaru</h2>
        <div id="posts" class="row mt-3"></div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p>&copy; 2025 Blog Saya | Dibuat dengan ❤️</p>
    </footer>

    <!-- Firebase SDK -->
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script type="module">
        // Konfigurasi Firebase
        const firebaseConfig = {
			apiKey: "{{site.API_KEY}}",
			authDomain: "{{site.AUTH_DOMAIN}}",
			databaseURL: "{{site.DATABASE_URL}}",
			projectId: "{{site.PROJECT_ID}}",
			storageBucket: "{{site.STORAGE_BUCKET}}",
			messagingSenderId: "{{site.SENDER_ID}}",
			appId: "{{site.APP_ID}}"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Fetch data dari Firestore
        async function fetchPosts() {
            const postsContainer = document.getElementById("posts");
            postsContainer.innerHTML = '<p class="text-center">Memuat postingan...</p>';

            try {
                const querySnapshot = await db.collection("posts").orderBy("date", "desc").limit(6).get();
                let html = "";
                querySnapshot.forEach(doc => {
                    const post = doc.data();
                    html += `
                        <div class="col-md-4">
                            <div class="card post-card mb-4 shadow-sm">
                                <img src="${post.image || 'https://via.placeholder.com/600'}" class="card-img-top" alt="${post.title}">
                                <div class="card-body">
                                    <h5 class="card-title">${post.title}</h5>
                                    <p class="card-text">${post.content.substring(0, 80)}...</p>
                                    <a href="post.html?id=${doc.id}" class="btn btn-primary">Baca Selengkapnya</a>
                                </div>
                            </div>
                        </div>`;
                });

                postsContainer.innerHTML = html;
            } catch (error) {
                postsContainer.innerHTML = `<p class="text-danger text-center">Gagal memuat postingan.</p>`;
                console.error("Error fetching posts:", error);
            }
        }

        fetchPosts();
    </script>

</body>
</html>

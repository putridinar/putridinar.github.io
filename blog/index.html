---
layout: default
permalink: /blog
---

    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; }
        .post { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
    </style>

    <div id="posts"></div>

    <script>
        async function fetchPosts() {
    try {
        const response = await fetch('/posts.json');
        
        // Periksa apakah respons berhasil
        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();
        
        // Pastikan data.posts ada dan berupa array
        if (!data.posts || !Array.isArray(data.posts)) {
            throw new Error("Invalid data format");
        }

        const postsContainer = document.getElementById("posts");
        if (!postsContainer) {
            throw new Error('Element with ID "posts" not found.');
        }

        postsContainer.innerHTML = data.posts.map(post => `
  <div class="card shadow-sm">
    <img src="{{ site.baseurl }}${post.img}" class="lazy img-card card-img-top" alt="${post.title}">
    <div class="card-body">
<div class="d-flex justify-content-between">
      <h5 class="card-title">
${post.title}</h5>
<a href="{{ site.baseurl }}${post.url}"><h3>Read</h3></a>
</div>
      <p class="card-text">
        ${post.excerpt}</p>
    </div>
    <div class="card-footer">
      <small class="text-body-secondary"><span>Last updated ${post.date}</span></small>
    </div>
  </div>
            <div class="post">
                <h2><a href="${post.url}">${post.title}</a></h2>
                <p>${post.excerpt}</p>
                <small>${post.date}</small>
            </div>
        `).join("");
    } catch (error) {
        console.error("Error fetching posts:", error);
        alert(`Error fetching posts: ${error.message}`);
    }
}

fetchPosts();
    </script>

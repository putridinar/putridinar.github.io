<!DOCTYPE html>
<html lang="{{ site.lang | default: page.lang | default: 'ID-id' }}" data-bs-theme="auto">
  
{% include head.html %}

 <body {% if page.url == '/' %} onload="onLoadSkeleton()"{% endif %}>
    <div class="wrapper-masthead">
      <div class="container">
        <header class="masthead clearfix shadow rounded-bottom">
          <a href="{{ site.baseurl }}/" class="shadow site-avatar"><img src="{{ site.avatar }}" /></a>

          <div class="site-info">
            <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <nav class="stickhead" id="stickyHead">
            <a href="{{ site.baseurl }}/">Blog</a>
            <a href="{{ site.baseurl }}/about">About</a>
            <a href="https://github.com/putridinar/putridinar.github.io">GitHub</a>
          </nav>
        </header>
      </div>
    </div>

    <div id="main" role="main" class="content container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    {% include analytics.html %}

<script>
window.onscroll = function() {myFunction()};

var header = document.getElementById("stickyHead");
var sticky = header.offsetTop;

function myFunction() {
  if (window.pageYOffset > sticky) {
    header.classList.add("sticky");
  } else {
    header.classList.remove("sticky");
  }
}
</script>

<script src="{{ '/assets/js/function.js' | relative_url }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  
  </body>
</html>

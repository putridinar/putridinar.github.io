<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post di Modal - Jekyll</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<form id="post-form">
    <input type="text" id="title" placeholder="Judul" required>
    <textarea id="content" placeholder="Isi post" required></textarea>
    <input type="text" id="image" placeholder="URL Gambar">
    <button type="submit">Tambah Post</button>
</form>

</body>
</html>

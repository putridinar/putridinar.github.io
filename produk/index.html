<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post di Modal - Jekyll</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h1>Daftar Produk</h1>
        <div id="post-list" class="row"></div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" data-bs-backdrop="static" data-bs-keyboard="false" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="postModalLabel">Judul Post</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <div id="loading" class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2">Memuat data...</p>
                    </div>
                    <img id="post-image" class="img-fluid d-none mb-3" alt="Post Image">
                    <p id="post-harga" class="d-none"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const postList = document.getElementById("post-list");

            // Ambil data dari JSON
            fetch("/assets/data/produk.json")
                .then(response => response.json())
                .then(posts => {
                    postList.innerHTML = "";
                    posts.forEach(post => {
                        const card = document.createElement("div");
                        card.className = "col-md-4 mb-4";
                        card.innerHTML = `
                            <div class="card h-100 shadow-sm">
                                <img src="${post.image}" class="card-img-top" alt="${post.harga}">
                                <div class="card-body text-center">
                                    <h5 class="card-title">${post.harga}</h5>
                                    <p class="card-text">${post.title.substring(0, 50)}...</p>
                                    <button class="btn btn-primary btn-sm" onclick="showPost(${post.id})" data-bs-toggle="modal" data-bs-target="#postModal">Lihat Detail</button>
                                </div>
                            </div>
                        `;
                        postList.appendChild(card);
                    });
                })
                .catch(error => console.error("Gagal mengambil data:", error));
        });

        // Fungsi untuk menampilkan post di modal
        function showPost(postId) {
            document.getElementById("loading").classList.remove("d-none");
    
document.getElementById("post-image").classList.add("d-none");
document.getElementById("post-harga").classList.add("d-none");

            fetch("/assets/data/produk.json")
                .then(response => response.json())
                .then(posts => {
                    const post = posts.find(p => p.id === postId);
                    if (post) {
                        document.getElementById("postModalLabel").textContent = post.harga;
document.getElementById("post-image").src = post.image;
                       document.getElementById("post-image").classList.remove("d-none");
                        document.getElementById("post-harga").textContent = post.harga;
document.getElementById("post-harga").classList.remove("d-none");
                        document.getElementById("loading").classList.add("d-none");

                    }
                })
                .catch(error => console.error("Gagal memuat detail post:", error));
        }
    </script>

</body>
</html>

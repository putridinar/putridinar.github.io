---
layout: none
permalink: /admin/posting/

<!DOCTYPE html>
<html lang="{{ site.lang | default: page.lang | default: 'ID-id' }}" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Produk - Jekyll</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
<form id="post-form">
<div class="mb-3">
  <label for="title" class="form-label">Masukan Judul</label>
    <input class="form-control" type="text" id="title" placeholder="Judul" required>
</div>
<div class="mb-3">
  <label for="content" class="form-label">Masukan text Konten</label>
    <textarea class="form-control" id="content" placeholder="Isi post" required></textarea>
</div>
<div class="mb-3">
  <label for="image" class="form-label">Masukan text Konten</label>
    <input class="form-control" type="text" id="image" placeholder="URL Gambar">
</div>
    <button class="btn btn-primary mb-3" type="submit">Tambah Post</button>
</form>
</div>
<script>
document.getElementById("post-form").addEventListener("submit", function(event) {
    event.preventDefault();

    const newPost = {
        id: Date.now(),
        title: document.getElementById("title").value,
        content: document.getElementById("content").value,
        image: document.getElementById("image").value || "/images/img.png"
    };

    // Tampilkan loading
    const submitButton = event.target.querySelector("button");
    submitButton.disabled = true;
    submitButton.textContent = "Menambahkan...";

    fetch("https://api.github.com/repos/putridinar/putridinar.github.io/contents/assets/posts.json", {
        method: "GET",
        headers: {
            "Accept": "application/vnd.github.v3+json"
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Gagal mengambil posts.json");
        }
        return response.json();
    })
    .then(data => {
        const content = JSON.parse(atob(data.content));
        content.push(newPost);

        return fetch("https://api.github.com/repos/putridinar/putridinar.github.io/contents/assets/posts.json", {
            method: "PUT",
            headers: {
                "Authorization": `token {{site.env.access_token}}`,
                "Accept": "application/vnd.github.v3+json",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: "Menambahkan post baru",
                content: btoa(JSON.stringify(content, null, 2)),
                sha: data.sha
            })
        });
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Gagal memperbarui posts.json");
        }
        return response.json();
    })
    .then(() => {
        alert("Post berhasil ditambahkan!");
        document.getElementById("post-form").reset();
    })
    .catch(error => {
        console.error("Error:", error);
        alert("Terjadi kesalahan! Cek konsol untuk detail.");
    })
    .finally(() => {
        // Kembalikan tombol submit
        submitButton.disabled = false;
        submitButton.textContent = "Tambah Post";
    });
});
</script>

</body>
</html>

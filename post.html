<!DOCTYPE html>
<html lang="{{ site.lang | default: 'id-ID' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artikel | Blog Saya</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/blog">Blog Saya</a>
        </div>
    </nav>

    <!-- Konten Artikel -->
    <div class="container mt-5">
        <div id="post-container" class="text-center">
            <p class="text-muted">Memuat artikel...</p>
        </div>
        <a href="/blog" class="btn btn-sm btn-secondary mt-3 mb-5">Kembali ke Beranda</a>
    </div>

    <!-- Firebase SDK -->
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script type="module">
        // Konfigurasi Firebase
        const firebaseConfig = {
				apiKey: "{{site.API_KEY}}",
				authDomain: "{{site.AUTH_DOMAIN}}",
				databaseURL: "{{site.DATABASE_URL}}",
				projectId: "{{site.PROJECT_ID}}",
				storageBucket: "{{site.STORAGE_BUCKET}}",
				messagingSenderId: "{{site.SENDER_ID}}",
				appId: "{{site.APP_ID}}"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Ambil ID artikel dari URL
        function getPostId() {
            const params = new URLSearchParams(window.location.search);
            return params.get("id"); // Mengambil nilai parameter "id" dari URL
        }

        // Fungsi untuk mengambil dan menampilkan artikel
        async function fetchPost() {
            const postId = getPostId();
            const postContainer = document.getElementById("post-container");

            if (!postId) {
                postContainer.innerHTML = `<p class="text-danger">Artikel tidak ditemukan.</p>`;
                return;
            }

            try {
                const doc = await db.collection("posts").doc(postId).get();

                if (!doc.exists) {
                    postContainer.innerHTML = `<p class="text-danger">Artikel tidak ditemukan.</p>`;
                    return;
                }

                const post = doc.data();

                postContainer.innerHTML = `
                    <h1 class="mb-3">${post.title}</h1>
                    <p class="text-muted">Dipublikasikan pada ${post.timestamp ? post.timestamp.toDate().toLocaleDateString() : "Tanggal tidak tersedia"
}</p>
					<div class='d-md-flex gap-3 mb-4'>
                    <img src="${post.image || 'https://via.placeholder.com/800x400'}" class="img-fluid rounded mb-2" alt="${post.title}">
					<div class='card p-3 mb-2'>
                    <p class="text-start">${post.content}</p>
					</div>
					</div>
                `;
            } catch (error) {
                postContainer.innerHTML = `<p class="text-danger">Gagal memuat artikel.</p>`;
                console.error("Error fetching post:", error);
            }
        }

        fetchPost();
    </script>

</body>
</html>

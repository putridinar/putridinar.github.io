---
layout: default
---

<div class="loading-skeleton">
 <div class="container mx-auto card-posts">
  {% for post in paginator.posts %}
  <div class="card">
    <img src="{{ site.baseurl }}{{ post.img }}" class="card-img-top" alt="{{ post.title }}">
    <div class="card-body">
      <h5 class="card-title"><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h5>
      <p class="card-text">
        {{ post.content | strip_html | strip | truncate: 100 }}</p>
    </div>
    <div class="card-footer">
      <small class="text-body-secondary"><span>Last updated {{ post.date | date: "%e-%m-%Y" }}</span></small>
    </div>
  </div>
  {% endfor %}
 </div>
</div>

<script>
$(document).ready(function(){
$(".loading-skeleton").delay(800).fadeOut(550);
})
</script>

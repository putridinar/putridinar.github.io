---
layout: default
permalink: /
---

 <div class="container mx-auto card-posts" id="myBlog" style="display:none;">
  {% for post in paginator.posts %}
  <div class="card shadow-sm">
    <img src="{{ site.baseurl }}{{ post.img }}" class="lazy img-card card-img-top" alt="{{ post.title }}">
    <div class="card-body">
<div class="d-flex justify-content-between">
      <h5 class="card-title">
{{ post.title | strip_html | strip | truncate: 22 }}</h5>
</div>
      <p class="card-text">
        {{ post.content | strip_html | strip | truncate: 100 }}</p>
    </div>
    <div class="card-footer d-flex justify-content-between">
      <small class="text-body-secondary"><span>Posting {{ post.date | date: "%e-%m-%Y" }}</span>
       <a href="{{ site.baseurl }}{{ post.url }}"><span class="fs-6">Baca</span></a></small>
    </div>
  </div>
  {% endfor %}
</div>

<!-- Skeleton Page -->

{% include skeleton.html %}

<!-- Pagination links -->

{% include paginator.html %}

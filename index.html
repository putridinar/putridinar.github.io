---
layout: default
---

 <div class="container mx-auto card-posts" id="myBlog" style="display:none;">
  {% for post in paginator.posts %}
  <div class="card shadow-sm">
    <img src="{{ site.baseurl }}{{ post.img }}" class="img-card card-img-top" alt="{{ post.title }}">
    <div class="card-body">
      <h5 class="card-title space-betwen"><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title | strip_html | strip | truncate: 22 }} Read</a></h5>
      <p class="card-text">
        {{ post.content | strip_html | strip | truncate: 100 }}</p>
    </div>
    <div class="card-footer">
      <small class="text-body-secondary"><span>Last updated {{ post.date | date: "%e-%m-%Y" }}</span></small>
    </div>
  </div>
  {% endfor %}
</div>

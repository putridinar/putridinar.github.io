---
layout: default
---

<div class="container mx-auto card-posts loading-skeleton">
  {% for post in paginator.posts %}
  <div class="card">
    <img src="{{ site.baseurl }}{{ post.img }}" class="card-img-top" alt="{{ post.title }}">
    <div class="card-body">
      <h5 class="card-title"><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h5>
      <p class="card-text">
        {{ post.content | strip_html | strip | truncate: 100 }}</p>
    </div>
    <div class="card-footer">
      <small class="text-body-secondary"><p>Last updated {{ post.date | date: "%e-%m-%Y" }}</p></small>
    </div>
  </div>
  {% endfor %}
</div>


<!-- Pagination links -->

{% include paginator.html %}

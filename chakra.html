<!DOCTYPE html>
<html lang="{{ site.lang | default: page.lang | default: 'ID-id' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@chakra-ui/react@latest"></script>
    <script src="https://unpkg.com/@emotion/react@latest"></script>
    <script src="https://unpkg.com/@emotion/styled@latest"></script>
    <script src="https://unpkg.com/framer-motion@latest"></script>
</head>
<body>
    <div id="root">
        <script type="text/babel">
            const { ChakraProvider, Box, Container, Heading, Link, Text, VStack, HStack, Button, useColorMode, IconButton, Flex } = window["@chakra-ui/react"];
            const { MoonIcon, SunIcon, ArrowUpIcon } = window["@chakra-ui/icons"];
            const { motion } = window["framer-motion"];
            
            function DarkModeToggle() {
                const { colorMode, toggleColorMode } = useColorMode();
                return (
                    <IconButton
                        icon={colorMode === "light" ? <MoonIcon /> : <SunIcon />}
                        onClick={toggleColorMode}
                        isRound
                        size="md"
                        alignSelf="flex-end"
                    />
                );
            }
            
            function BackToTop() {
                return (
                    <IconButton
                        icon={<ArrowUpIcon />}
                        position="fixed"
                        bottom={5}
                        right={5}
                        onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
                        isRound
                        size="md"
                    />
                );
            }
            
            function App() {
                return (
                    <ChakraProvider>
                        <Box minH="100vh" py={10} bg="gray.100" transition="background 0.3s ease">
                            <Container maxW="container.md" bg="white" p={5} borderRadius="md" boxShadow="md">
                                <Flex justify="space-between" align="center">
                                    <Heading as="h1" size="xl">{{ site.title }}</Heading>
                                    <DarkModeToggle />
                                </Flex>
                                <HStack spacing={4} mb={4} mt={4}>
                                    <Link href="/">Home</Link>
                                    <Link href="/produk">About</Link>
                                    <Link href="/blog">Blog</Link>
                                </HStack>
                                <Box>
                                    <Text fontSize="lg">{{ content }}</Text>
                                </Box>
                            </Container>
                            <Box as="footer" mt={10} textAlign="center" py={4} bg="gray.200">
                                <Text>&copy; 2025 My Jekyll Site</Text>
                                <HStack spacing={4} justify="center" mt={2}>
                                    <Link href="#">Twitter</Link>
                                    <Link href="#">GitHub</Link>
                                    <Link href="#">LinkedIn</Link>
                                </HStack>
                            </Box>
                            <BackToTop />
                        </Box>
                    </ChakraProvider>
                );
            }
            
            ReactDOM.render(<App />, document.getElementById("root"));
        </script>
    </div>
</body>
</html>

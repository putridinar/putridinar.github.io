<script type="module">
    // Konfigurasi Firebase
    const firebaseConfig = {
        apiKey: "{{site.API_KEY}}",
        authDomain: "{{site.AUTH_DOMAIN}}",
        databaseURL: "{{site.DATABASE_URL}}",
        projectId: "{{site.PROJECT_ID}}",
        storageBucket: "{{site.STORAGE_BUCKET}}",
        messagingSenderId: "{{site.SENDER_ID}}",
        appId: "{{site.APP_ID}}"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Fetch data dari Firestore
    async function fetchPosts() {
        const postsContainer = document.getElementById("posts");
        postsContainer.innerHTML = `
            <div class="d-flex justify-content-center align-items-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        `;

        try {
            const querySnapshot = await db.collection("posts").orderBy("timestamp", "desc").limit(6).get();
            let html = "";
            querySnapshot.forEach(doc => {
                const post = doc.data();
                html += `
                    <div class="col">
                        <div class="card h-100 shadow-sm">
                            <img src="${post.image || 'https://via.placeholder.com/600'}" class="card-img-top" alt="${post.title}" loading="lazy">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${post.title}</h5>
                                <p class="card-text text-muted">${post.content.substring(0, 100)}...</p>
                                <a href="/blog/post.html?id=${doc.id}" class="btn btn-primary align-self-start mt-auto">Baca Selengkapnya</a>
                            </div>
                        </div>
                    </div>
                `;
            });

            postsContainer.innerHTML = html;
        } catch (error) {
            postsContainer.innerHTML = `
                <p class="text-danger text-center">Gagal memuat postingan.</p>
            `;
            console.error("Error fetching posts:", error);
        }
    }

    fetchPosts();
</script>

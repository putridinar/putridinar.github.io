<script type="module">
    // Konfigurasi Firebase
    const firebaseConfig = {
        apiKey: "{{site.API_KEY}}",
        authDomain: "{{site.AUTH_DOMAIN}}",
        databaseURL: "{{site.DATABASE_URL}}",
        projectId: "{{site.PROJECT_ID}}",
        storageBucket: "{{site.STORAGE_BUCKET}}",
        messagingSenderId: "{{site.SENDER_ID}}",
        appId: "{{site.APP_ID}}"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Fetch data dari Firestore
    async function fetchPosts() {
        const postsContainer = document.getElementById("posts");
        postsContainer.innerHTML = `
            <div class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-75 d-flex justify-content-center align-items-center" style="z-index: 2000;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        `;

        try {
            const querySnapshot = await db.collection("posts").orderBy("timestamp", "desc").limit(6).get();
            let html = "";
            querySnapshot.forEach(doc => {
                const post = doc.data();
                html += `
<div class="col" data-aos="fade-up" data-aos-delay="100">
    <div class="card h-100 shadow lux-card">
        <img src="${post.image || 'https://putridinar.github.io/images/img.png'}" class="card-img-top" alt="${post.title}" loading="lazy">
        <div class="card-body d-flex flex-column">
            <h5 class="card-title fw-bold">${post.title}</h5>
            <p class="card-text opacity-55">${post.content.substring(0, 100)}...</p>
            <a href="/blog/post.html?id=${doc.id}" class="btn btn-outline-secondary mt-auto rounded-pill px-4 py-2">✨ Baca Selengkapnya</a>
        </div>
    </div>
</div>
                `;
            });

            postsContainer.innerHTML = html;
        } catch (error) {
            postsContainer.innerHTML = `
                <p class="text-danger text-center">Gagal memuat postingan.</p>
            `;
            console.error("Error fetching posts:", error);
        }
    }

    fetchPosts();
</script>
<style>
    .lux-card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: transform 0.5s ease, box-shadow 0.5s ease;
        border-radius: 1.25rem;
    }

    .lux-card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .lux-card img {
        border-top-left-radius: 1.25rem;
        border-top-right-radius: 1.25rem;
        transition: transform 0.5s ease;
		width: 100%;
		height: 220px;
		object-fit: cover;
		background-position: center;
		background-size: cover;
}
    }

    .lux-card:hover img {
        transform: scale(1.05);
    }
</style>

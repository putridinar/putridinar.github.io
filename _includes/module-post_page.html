<script type="module">
    // Konfigurasi Firebase
    const firebaseConfig = {
        apiKey: "{{site.API_KEY}}",
        authDomain: "{{site.AUTH_DOMAIN}}",
        databaseURL: "{{site.DATABASE_URL}}",
        projectId: "{{site.PROJECT_ID}}",
        storageBucket: "{{site.STORAGE_BUCKET}}",
        messagingSenderId: "{{site.SENDER_ID}}",
        appId: "{{site.APP_ID}}"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Ambil ID Artikel dari URL
    function getPostId() {
        const params = new URLSearchParams(window.location.search);
        return params.get("id");
    }

    // Fetch Data Artikel
    async function fetchPost() {
        const postId = getPostId();
        const postContainer = document.getElementById("postContent");
        const postTitle = document.getElementById("postTitle");
        const postDate = document.getElementById("postDate");
        const postImage = document.getElementById("postImage");
        const postAuthor = document.getElementById("postAuthor");

        if (!postId) {
            postContainer.innerHTML = `<p class="text-danger">Artikel tidak ditemukan.</p>`;
            return;
        }

        try {
            const doc = await db.collection("posts").doc(postId).get();

            if (!doc.exists) {
                postContainer.innerHTML = `<p class="text-danger">Artikel tidak ditemukan.</p>`;
                return;
            }

            const post = doc.data();

            postTitle.textContent = post.title || "Judul Tidak Tersedia";
            postDate.textContent = post.timestamp
                ? new Date(post.timestamp.toDate()).toLocaleDateString("id-ID", {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                })
                : "Tanggal tidak tersedia";
            postImage.src = post.image || "https://via.placeholder.com/1200x600";
            postContainer.innerHTML = post.content || "<p>Konten tidak tersedia.</p>";
            postAuthor.textContent = post.author || "Penulis Tidak Diketahui";
        } catch (error) {
            postContainer.innerHTML = `<p class="text-danger">Gagal memuat artikel.</p>`;
            console.error("Error fetching post:", error);
        }
    }

    fetchPost();
</script>

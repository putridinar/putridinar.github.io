<script type="module">
    // Konfigurasi Firebase
    const firebaseConfig = {
        apiKey: "{{site.API_KEY}}",
        authDomain: "{{site.AUTH_DOMAIN}}",
        databaseURL: "{{site.DATABASE_URL}}",
        projectId: "{{site.PROJECT_ID}}",
        storageBucket: "{{site.STORAGE_BUCKET}}",
        messagingSenderId: "{{site.SENDER_ID}}",
        appId: "{{site.APP_ID}}"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Ambil ID Post dari URL
    const params = new URLSearchParams(window.location.search);
    const postId = params.get("id");

    // Fetch Single Post
    async function fetchPost() {
        if (!postId) {
            document.getElementById("blogPosts").innerHTML = "<p class='text-danger'>Post tidak ditemukan.</p>";
            return;
        }

        try {
            const postDoc = await db.collection("posts").doc(postId).get();
            if (!postDoc.exists) {
                document.getElementById("blogPosts").innerHTML = "<p class='text-danger'>Post tidak ditemukan.</p>";
                return;
            }

            const post = postDoc.data();
            document.getElementById("postTitle").textContent = post.title || "Judul Tidak Tersedia";
            document.getElementById("postDate").textContent = new Date(post.timestamp?.toDate()).toLocaleDateString("id-ID", {
                year: "numeric",
                month: "long",
                day: "numeric"
            });
            document.getElementById("postImage").src = post.image || "https://via.placeholder.com/800x400";
            document.getElementById("postContent").innerHTML = post.content || "<p>Konten tidak tersedia.</p>";
            document.getElementById("postAuthor").textContent = post.author || "Penulis Tidak Diketahui";
        } catch (error) {
            console.error("Error fetching post:", error);
            document.getElementById("blogPosts").innerHTML = "<p class='text-danger'>Gagal memuat konten.</p>";
        }
    }

    fetchPost();
</script>

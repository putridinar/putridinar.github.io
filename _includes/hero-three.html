<header id="hero-header">
  <canvas id="bg-canvas"></canvas>
  <div class="hero-content">
    <h1>{{site.title}}</h1>
    <p>Berbagi ide, cerita, dan teknologi ✨</p>
  </div>
  <canvas id="overlay-canvas"></canvas> <!-- Canvas kedua -->
</header>

<style>
  #hero-header {
    position: relative;
    height: 100vh;
    overflow: hidden;
    background: #111;
    color: white;
  }

  #bg-canvas, #overlay-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    text-align: center;
  }

  .hero-content h1 {
    font-size: 3rem;
    margin: 0;
    text-shadow: 0 0 10px #00ccff;
  }

  .hero-content p {
    font-size: 1.2rem;
    margin-top: 10px;
    color: #ccc;
  }
</style>

<script>
  // Canvas pertama untuk partikel
  const bgCanvas = document.getElementById("bg-canvas");
  const bgCtx = bgCanvas.getContext("2d");

  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;

  let particles = [];
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * bgCanvas.width,
      y: Math.random() * bgCanvas.height,
      vx: (Math.random() - 0.5) * 1,
      vy: (Math.random() - 0.5) * 1,
      r: 1 + Math.random() * 2
    });
  }

  function drawParticles() {
    bgCtx.fillStyle = "rgba(17,17,17,0.2)";
    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

    for (let p of particles) {
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0 || p.x > bgCanvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > bgCanvas.height) p.vy *= -1;

      bgCtx.beginPath();
      bgCtx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
      bgCtx.fillStyle = "#00ccff";
      bgCtx.fill();
    }

    requestAnimationFrame(drawParticles);
  }

  drawParticles();

  // Canvas kedua untuk overlay animasi lain (misal gambar bergerak)
  const overlayCanvas = document.getElementById("overlay-canvas");
  const overlayCtx = overlayCanvas.getContext("2d");

  overlayCanvas.width = window.innerWidth;
  overlayCanvas.height = window.innerHeight;

  let overlayParticles = []; // Ganti nama variabel di canvas kedua

  for (let i = 0; i < 50; i++) {
    overlayParticles.push({
      x: Math.random() * overlayCanvas.width,
      y: Math.random() * overlayCanvas.height,
      vx: (Math.random() - 0.5) * 1,
      vy: (Math.random() - 0.5) * 1,
      r: 1 + Math.random() * 2
    });
  }

  function drawOverlay() {
    overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

    // Tambahkan partikel overlay
    for (let p of overlayParticles) {
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0 || p.x > overlayCanvas.width) p.vx *= -1;
      if (p.y < 0 || p.y > overlayCanvas.height) p.vy *= -1;

      overlayCtx.beginPath();
      overlayCtx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
      overlayCtx.fillStyle = "rgba(255, 255, 255, 0.7)";
      overlayCtx.fill();
    }

    requestAnimationFrame(drawOverlay);
  }

  drawOverlay();

  window.addEventListener("resize", () => {
    bgCanvas.width = overlayCanvas.width = window.innerWidth;
    bgCanvas.height = overlayCanvas.height = window.innerHeight;
  });
</script>

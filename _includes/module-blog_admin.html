<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Inisialisasi Firebase
    const firebaseConfig = {
        apiKey: "{{site.API_KEY}}",
        authDomain: "{{site.AUTH_DOMAIN}}",
        databaseURL: "{{site.DATABASE_URL}}",
        projectId: "{{site.PROJECT_ID}}",
        storageBucket: "{{site.STORAGE_BUCKET}}",
        messagingSenderId: "{{site.SENDER_ID}}",
        appId: "{{site.APP_ID}}"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    document.getElementById("post-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const newPost = {
            title: document.getElementById("title").value,
            content: document.getElementById("content").value,
            image: document.getElementById("image").value || "/images/img.png",
            timestamp: serverTimestamp()
        };

        const submitButton = event.target.querySelector("button");
        submitButton.disabled = true;
        submitButton.textContent = "Menambahkan...";

        try {
            await addDoc(collection(db, "posts"), newPost);
            showAlert("Post berhasil ditambahkan!", "success");
            document.getElementById("post-form").reset();
        } catch (error) {
            console.error("Error:", error);
            showAlert("Terjadi kesalahan! Cek konsol untuk detail.", "danger");
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Tambah Post";
        }
    });

    function editPost(postId) {
        const updatedPost = {
            title: document.getElementById("title").value,
            content: document.getElementById("content").value,
            image: document.getElementById("image").value || "/images/img.png",
            timestamp: serverTimestamp()
        };

        updateDoc(doc(db, "posts", postId), updatedPost)
        .then(() => showAlert("Post berhasil diperbarui!", "success"))
        .catch(error => {
            console.error("Error:", error);
            showAlert("Terjadi kesalahan! Cek konsol untuk detail.", "danger");
        });
    }

    function deletePost(postId) {
        deleteDoc(doc(db, "posts", postId))
        .then(() => showAlert("Post berhasil dihapus!", "success"))
        .catch(error => {
            console.error("Error:", error);
            showAlert("Terjadi kesalahan! Cek konsol untuk detail.", "danger");
        });
    }

    document.getElementById("logoutBtn").addEventListener("click", async function () {
        try {
            await signOut(auth);
            console.log("Logout berhasil!");
            showAlert("Logout Berhasil...", "success");
            window.location.href = "/admin/login/";
        } catch (error) {
            console.error("Error:", error.message);
            showAlert("" + error.message, "danger");
        }
    });

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = "/blog/";
        }
    });

    function showAlert(message, type) {
        const alertPlaceholder = document.getElementById('alertPlaceholder');
        const alertHTML = `
            <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>`;
        alertPlaceholder.innerHTML = alertHTML;
    }
</script>

<!-- HTML Container for Bootstrap Alerts -->
<div class="position-absolute mx-auto w-75 top-50 start-50 translate-middle-x" id="alertPlaceholder"></div>

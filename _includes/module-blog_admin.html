<script type="module">
    // Inisialisasi Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDfZEKaggvi2SN4Jeyhc3XCeb4A1DJVmQE",
        authDomain: "vems-olshop.firebaseapp.com",
        databaseURL: "https://vems-olshop-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "vems-olshop",
        storageBucket: "vems-olshop.firebasestorage.app",
        messagingSenderId: "281544003271",
        appId: "1:281544003271:web:1e1d6c0e66f0e4583638e2",
        measurementId: "G-RGVXFFWN72"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("post-form").addEventListener("submit", function(event) {
        event.preventDefault();

        const newPost = {
            title: document.getElementById("title").value,
            content: document.getElementById("content").value,
            image: document.getElementById("image").value || "/images/img.png",
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        // Tampilkan loading
        const submitButton = event.target.querySelector("button");
        submitButton.disabled = true;
        submitButton.textContent = "Menambahkan...";

        // Simpan post ke Firestore
        db.collection("posts").add(newPost)
        .then(() => {
            showAlert("Post berhasil ditambahkan!", "success");
            document.getElementById("post-form").reset();
        })
        .catch(error => {
            console.error("Error:", error);
            showAlert("Terjadi kesalahan! Cek konsol untuk detail.", "danger");
        })
        .finally(() => {
            submitButton.disabled = false;
            submitButton.textContent = "Tambah Post";
        });
    });

    // Logout function
    document.getElementById("logoutBtn").addEventListener("click", async function () {
        try {
            await firebase.auth().signOut();
            console.log("Logout berhasil!");
            showAlert("Anda telah keluar.", "success");
            window.location.href = "/admin/login/";
        } catch (error) {
            console.error("Logout error:", error.message);
            showAlert("Gagal logout: " + error.message, "danger");
        }
    });

    firebase.auth().onAuthStateChanged((user) => {
        if (!user) {
            window.location.href = "/blog/";
        }
    });

    function showAlert(message, type) {
        const alertPlaceholder = document.getElementById('alertPlaceholder');
        const alertHTML = `
            <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>`;
        alertPlaceholder.innerHTML = alertHTML;
    }
</script>

<!-- HTML Container for Bootstrap Alerts -->
<div id="alertPlaceholder"></div>

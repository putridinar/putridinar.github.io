  function showToast(message) {
    // Periksa apakah toast sudah ada, jika belum buat elemen baru
    let toastEl = document.getElementById("customToast");
    if (!toastEl) {
        // Buat elemen toast baru
        toastEl = document.createElement("div");
        toastEl.id = "customToast";
        toastEl.className = "toast align-items-center position-fixed top-0 end-0 m-3";
        toastEl.setAttribute("role", "alert");
        toastEl.setAttribute("aria-live", "assertive");
        toastEl.setAttribute("aria-atomic", "true");

        toastEl.innerHTML = `
          <div class="d-flex">
            <div class="toast-body">
              ${message}
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        `;

        // Tambahkan ke body
        document.body.appendChild(toastEl);
    } else {
        // Jika sudah ada, cukup ubah teksnya
        toastEl.querySelector(".toast-body").textContent = message;
    }

    // Tampilkan toast menggunakan Bootstrap
    const toast = new bootstrap.Toast(toastEl);
    toast.show();
}
